<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480">
    <!--
      Quill silhouette, taken from quill_fill.svg and flattened to a single
      solid path: gradients and outlines turn to mush at 16x16, so a favicon
      wants one clean shape. The translate centres the artwork's bounding box
      inside a square viewBox.

      Browsers evaluate prefers-color-scheme inside SVG favicons, so this one
      file covers both light and dark tab bars — no second variant needed.
    -->
    <g transform="translate(-278.97, -147.68)">
        <path d="M311.472,610.541C311.472,610.541 371.151,543.955 375.297,520.068C377.616,506.705 406.688,476.185 406.688,476.185C421.276,370.692 550.73,221.004 634.877,186.753C634.877,186.753 683.778,164.675 702.382,179.979C726.354,199.699 637.907,293.84 560.154,375.994C517.254,416.104 474.053,456.649 438.266,492.016C423.086,492.444 407.241,504.814 390.856,526.919L311.472,610.541Z"/>
    </g>
    <style>
        path { fill: #1a1a1a; }
        @media (prefers-color-scheme: dark) {
            path { fill: #f0f0f0; }
        }
    </style>
</svg>
